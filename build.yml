name: Build MSMSF RACING APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip blackwhite source
        run: |
          rm -rf source
          unzip -o Juken-blackwhite-dark-light.zip -d source
          ls source

      - name: Build APK
        run: |
          cd source
          PROJECT=$(find . -name "gradlew" | head -n 1 | xargs dirname)
          cd $PROJECT
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create Release V.11
        uses: softprops/action-gh-release@v1
        with:
          tag_name: V.11
          name: MSMSF RACING V.11 BlackWhite Fix
          body: Update gratis tema BlackWhite Dark Light - Bug fix ECU JUKEN 5+ connect & logger
          files: source/**/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
