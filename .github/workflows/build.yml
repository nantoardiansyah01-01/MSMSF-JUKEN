name: Build MSMSF RACING APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clean old build
        run: |
          rm -rf source app build
          rm -f *.apk

      - name: Unzip BLACKWHITE source only
        run: |
          unzip -o Juken-blackwhite-dark-light.zip -d source
          echo "=== ISI FOLDER BARU ==="
          ls -lh source

      - name: Build APK from new source
        run: |
          cd source
          # Cari lokasi gradlew yang bener di folder baru
          GRADLE_PATH=$(find . -type f -name "gradlew" | head -n 1)
          echo "Found gradlew at: $GRADLE_PATH"
          DIR=$(dirname "$GRADLE_PATH")
          cd $DIR
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSMSF-RACING-V12-BLACKWHITE
          path: |
            **/*.apk
            source/**/*.apk

      - name: Create Release V.12 NEW
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V.12
          name: MSMSF RACING V.12 - BlackWhite Dark Light FIX
          body: |
            FIXED: Update gratis BlackWhite Dark Light
            - Tema Dark Light fixed
            - Connect ECU BRT JUKEN 5+ & Logger OK
            - Source: Juken-blackwhite-dark-light.zip
          files: |
            **/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
