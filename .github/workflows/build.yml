name: Build MSMSF RACING APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip and LIST
        run: |
          rm -rf source
          unzip -o Juken-blackwhite-dark-light.zip -d source
          echo "=== STRUKTUR LENGKAP ==="
          find source -type f | head -n 100
          echo "=== CARI GRADLEW ==="
          find source -name "gradlew" -o -name "build.gradle" -o -name "pubspec.yaml" -o -name "*.apk" | head -n 50
          ls -la source/

      - name: Try Build
        run: |
          # kalau ada gradlew
          if [ -f "$(find source -name gradlew | head -n 1)" ]; then
            GP=$(find source -name gradlew | head -n 1)
            echo "Build gradle di $GP"
            DIR=$(dirname "$GP")
            cd $DIR
            chmod +x gradlew
            ./gradlew assembleDebug
          # kalau flutter
          elif [ -f "$(find source -name pubspec.yaml | head -n 1)" ]; then
            echo "Ini project FLUTTER bos!"
            sudo apt-get update
            sudo apt-get install -y curl unzip
            # install flutter
            curl -o flutter.tar.xz https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.22.0-stable.tar.xz
            tar xf flutter.tar.xz
            export PATH="$PATH:`pwd`/flutter/bin"
            cd source
            FP=$(find . -name pubspec.yaml | head -n 1 | xargs dirname)
            cd $FP
            flutter build apk --debug
          else
            echo "Gak ada gradlew & gak ada pubspec, cek log di atas!"
            exit 1
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MSMSF-RACING-DIAGNOSIS
          path: |
            **/*.apk
