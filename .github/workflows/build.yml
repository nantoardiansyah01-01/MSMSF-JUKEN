name: Build MSMSF RACING APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o Juken-main.zip -d ./app_source
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant gradlew permission
        run: |
          GRADLEW=$(find ./app_source -name "gradlew" | head -n 1)
          chmod +x $GRADLEW
          echo "ROOT_DIR=$(dirname $GRADLEW)" >> $GITHUB_ENV
      - name: Build APK Debug
        run: |
          cd ${{ env.ROOT_DIR }}
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSMSF-RACING-APK
          path: ${{ env.ROOT_DIR }}/app/build/outputs/apk/debug/*.apk
