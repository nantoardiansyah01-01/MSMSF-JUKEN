name: Build MSMSF RACING APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          echo "=== FILES IN REPO ==="
          ls -la
          echo "=== UNZIP ALL ZIPS ==="
          for zip in *.zip; do
            echo "Unzipping $zip"
            unzip -o "$zip" -d ./app_source
          done
          echo "=== INSIDE app_source ==="
          ls -la ./app_source
          echo "=== FIND GRADLEW ==="
          find . -name "gradlew"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant gradlew permission
        run: |
          GRADLEW=$(find . -name "gradlew" | head -n 1)
          echo "Found gradlew at $GRADLEW"
          chmod +x $GRADLEW
          echo "ROOT_DIR=$(dirname $GRADLEW)" >> $GITHUB_ENV

      - name: Build APK Debug
        run: |
          cd ${{ env.ROOT_DIR }}
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSMSF-RACING-APK
          path: ${{ env.ROOT_DIR }}/app/build/outputs/apk/debug/*.apk
