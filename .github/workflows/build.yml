name: Build MSMSF RACING APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: PAKSA BALIKIN Juken-main.zip
        run: |
          ls -lh *.zip || true
          if [ ! -f Juken-main.zip ]; then
            echo "Mencoba balikin dari raw github commit #6..."
            curl -L -o Juken-main.zip https://github.com/nantoardic/MSMSF-JUKEN/raw/a630993/Juken-main.zip
            ls -lh Juken-main.zip
          fi
          if [ ! -f Juken-main.zip ]; then
            echo "Coba commit lain..."
            curl -L -o Juken-main.zip https://github.com/nantoardic/MSMSF-JUKEN/raw/main/Juken-main.zip || true
          fi
          ls -lh *.zip

      - name: Build Hybrid BlackWhite
        run: |
          rm -rf source && mkdir -p source
          echo "=== Unzip Juken-main ==="
          unzip -o Juken-main.zip -d source
          echo "=== Unzip BlackWhite di atasnya ==="
          unzip -o Juken-blackwhite-dark-light.zip -d source
          echo "=== CARI GRADLEW ==="
          find source -name "gradlew*" -type f | head -n 10
          ls -R source | head -n 100

      - name: Make executable and Build
        run: |
          GP=$(find source -type f -name "gradlew" | head -n 1)
          echo "Found gradlew at: $GP"
          if [ -z "$GP" ]; then echo "GRADLEW TIDAK KETEMU! Lihat list di atas!"; exit 1; fi
          DIR=$(dirname "$GP")
          echo "Dir: $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Final
        uses: actions/upload-artifact@v4
        with:
          name: MSMSF-RACING-V12-BLACKWHITE-FINAL
          path: "**/*.apk"

      - name: Release V.12
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V.12
          name: MSMSF RACING V.12 BlackWhite
          files: "**/*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
