name: Build MSMSF RACING APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip and LIST ISI
        run: |
          rm -rf source
          mkdir -p source
          unzip -o Juken-blackwhite-dark-light.zip -d source
          echo "========== ISI ASLI ZIP =========="
          find source -type f -maxdepth 4 | sort
          ls -lh source/

      - name: Upload ZIP Content for Check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ISI-ZIP-BLACKWHITE
          path: source/
