name: Build MSMSF RACING APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clean old build
        run: |
          rm -rf source app build
          rm -f *.apk

      - name: Unzip BLACKWHITE source only
        run: |
          unzip -o Juken-blackwhite-dark-light.zip -d source
          ls source

      - name: Make gradlew executable
        run: |
          find source -name "gradlew" -exec chmod +x {} \;

      - name: Build APK from new source
        run: |
          cd source
          GRADLE_PATH=$(find . -type f -name "gradlew" | head -n 1)
          echo "Found gradlew at: $GRADLE_PATH"
          DIR=$(dirname "$GRADLE_PATH")
          cd $DIR
          ./gradlew assembleDebug --stacktrace

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MSMSF-RACING-V12-BLACKWHITE
          path: |
            **/*.apk

      - name: Create Release V.12 NEW
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V.12
          name: MSMSF RACING V.12 - BlackWhite Dark Light FIX
          body: FIXED gratis BlackWhite Dark Light - ECU JUKEN 5+
          files: |
            **/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
