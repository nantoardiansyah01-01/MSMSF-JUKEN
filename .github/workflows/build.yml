name: Build MSMSF RACING APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: RESTORE Juken-main dari History Git
        run: |
          echo "=== Cari commit yang punya Juken-main.zip ==="
          git log --all --oneline --name-only -- "Juken-main.zip" | head -n 30
          echo "=== Coba restore ==="
          for C in $(git log --all --pretty=format:%H -- Juken-main.zip); do
            echo "Coba commit $C"
            git show $C:Juken-main.zip > Juken-main.zip 2>/dev/null && ls -lh Juken-main.zip && break
            git checkout $C -- Juken-main.zip 2>/dev/null && ls -lh Juken-main.zip && break
          done
          echo "=== HASIL AKHIR ==="
          ls -lh *.zip

      - name: Build Hybrid
        run: |
          rm -rf source && mkdir source
          unzip -o Juken-main.zip -d source
          echo "--- setelah main.zip ---"
          find source -maxdepth 3 -type f | head -n 50
          unzip -o Juken-blackwhite-dark-light.zip -d source
          echo "--- setelah blackwhite ---"
          find source -name "gradlew*" | head -n 10
          ls -R source | grep -E "gradlew|build.gradle" | head -n 20

      - name: Build APK
        run: |
          GP=$(find source -type f -name "gradlew" | head -n 1)
          echo "gradlew di: $GP"
          [ -z "$GP" ] && echo "GAK KETEMU!" && exit 1
          DIR=$(dirname "$GP")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSMSF-RACING-V12-FINAL
          path: "**/*.apk"

      - name: Release V.12
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V.12
          files: "**/*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
