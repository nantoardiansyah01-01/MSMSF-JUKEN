name: Build MSMSF RACING APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: RESTORE Juken-main.zip dari History
        run: |
          echo "Cek zip yang ada:"
          ls -lh *.zip || true
          if [ ! -f Juken-main.zip ]; then
            echo "Juken-main.zip hilang, cari di history git..."
            git log --all --pretty=format:%H -- Juken-main.zip > /tmp/commits.txt
            cat /tmp/commits.txt
            for C in $(cat /tmp/commits.txt); do
              echo "Coba restore dari $C"
              git show $C:Juken-main.zip > Juken-main.zip 2>/dev/null && break
            done
          fi
          echo "HASIL:"
          ls -lh *.zip
          du -h Juken-main.zip

      - name: Build Hybrid BlackWhite
        run: |
          rm -rf source && mkdir source
          unzip -o Juken-main.zip -d source
          unzip -o Juken-blackwhite-dark-light.zip -d source
          echo "Cari gradlew:"
          find source -name gradlew -type f

      - name: Make executable and Build
        run: |
          GP=$(find source -type f -name gradlew | head -n 1)
          echo "gradlew at: $GP"
          if [ -z "$GP" ]; then echo "GRADLEW GAK KETEMU"; ls -R source | head -n 100; exit 1; fi
          DIR=$(dirname "$GP")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Final
        uses: actions/upload-artifact@v4
        with:
          name: MSMSF-RACING-V12-BLACKWHITE-FINAL
          path: "**/build/outputs/apk/**/*.apk"

      - name: Release V.12
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V.12
          name: MSMSF RACING V.12 BlackWhite
          files: "**/build/outputs/apk/**/*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
